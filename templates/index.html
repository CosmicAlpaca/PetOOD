<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet OOD Detection API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
        .hero-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 50px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); max-width: 800px; }
        .btn-custom { background: white; color: #764ba2; font-weight: bold; padding: 15px 40px; border-radius: 50px; transition: 0.3s; }
        .btn-custom:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="container hero-card">
        <h1 class="display-3 fw-bold mb-4">Pet OOD Detection API</h1>
        <p class="lead mb-5">Hệ thống nhận diện thú cưng (In-Distribution) và phát hiện vật thể lạ (Out-of-Distribution) sử dụng công nghệ Contrastive Learning tiên tiến.</p>
        <div class="d-flex justify-content-center gap-3">
            <a href="/app" class="btn btn-custom">Truy cập Web App Demo</a>
        </div>
        <p class="mt-4 text-white-50"><small>API Endpoint: POST /api/predict</small></p>
    </div>
</body>
</html>
